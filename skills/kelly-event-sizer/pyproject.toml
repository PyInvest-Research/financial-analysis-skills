[project]
name = "kelly-event-sizer"
version = "1.1.0"
description = "JSON tools for binary-event Kelly sizing and calibration"
requires-python = ">=3.12"
dependencies = ["numpy>=2.3,<3", "scipy>=1.16,<2"]
license = "MIT"

[dependency-groups]
dev = ["autopep8>=2.3,<3", "flake8>=7.3,<8", "pyyaml>=6,<7"]

[tool.uv]
package = false
required-version = ">=0.13.4"
